<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kiriko — hand tracker</title>
<style>
  :root {
    --ink: #d8d4c8;
    --ink-faint: #6b675c;
    --line: #2c2a24;
  }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #14130f; color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  }
  canvas { border: 1px solid var(--line); transform: none; }
  video { display: none; }
  #status { color: var(--ink-faint); }
  #status b { color: var(--ink); font-weight: normal; }
  button {
    all: unset; cursor: pointer; color: var(--ink-faint);
    letter-spacing: inherit; text-transform: inherit; font: inherit;
    transition: color 0.3s;
  }
  button:hover { color: var(--ink); }
</style>
</head>
<body>
<canvas id="view" width="480" height="270"></canvas>
<div id="status"><b>kiriko</b> — camera off</div>
<div>
  <button id="start">✋ start tracking</button>
  &nbsp;·&nbsp;
  <button id="reset">reset tiles</button>
</div>
<video id="cam" muted playsinline></video>

<script type="module">
// MediaPipe runs entirely in-browser (WASM); these URLs are fetched once for
// the runtime and the landmark model. No video leaves the machine — only tiny
// JSON hand-position messages go to TouchDesigner on localhost.
import { FilesetResolver, HandLandmarker } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL_URL =
  "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

// TouchDesigner Web Server DAT, created by td/build.py.
const TD_URL = "ws://127.0.0.1:9980";
const RETRY_MS = 3000;

const POS_SMOOTH = 0.45; // EMA on hand positions
const VEL_SMOOTH = 0.35; // EMA on velocity — keeps swipe angle steady

const TIP_IDS = [4, 8, 12, 16, 20]; // thumb, index, middle, ring, pinky tips
// Spread = mean gap between neighbouring fingertips (thumb excluded),
// normalized by palm length. These map that raw value onto 0..1:
const SPREAD_MIN = 0.12; // fingers together
const SPREAD_MAX = 0.42; // fingers fanned out

// Which hand (as MediaPipe labels it) does exposure; the other breaks glass.
// If the roles feel swapped on your camera, change this to "Right".
const EXPOSURE_HAND = "Left";

// Gallery nav: with only ONE hand in frame, a fast horizontal rip flips to
// the next/previous image in assets/. Must be faster than a break swipe.
const NAV_V = 1.6;           // horizontal speed (frame-widths/sec)
const NAV_COOLDOWN = 900;    // ms; one flip per rip, ignores the return path

const statusEl = document.getElementById("status");
const video = document.getElementById("cam");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");

let ws = null;
let linked = false;

// Silently retries while TD isn't running, same convention as the orbit.
function connect() {
  ws = new WebSocket(TD_URL);
  ws.onopen = () => { linked = true; };
  ws.onclose = () => { linked = false; setTimeout(connect, RETRY_MS); };
  ws.onerror = () => {};
}
connect();

function send(msg) {
  if (linked && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

document.getElementById("reset").onclick = () => send({ type: "reset" });

// Smoothed position + velocity for one tracked hand, mirrored, v-up.
function makeTrack() {
  return {
    sx: 0.5, sy: 0.5, vx: 0, vy: 0, seen: false,
    update(lm, dt) {
      const x = 1 - lm[9].x, y = 1 - lm[9].y; // palm center, TD uv space
      if (!this.seen) { this.sx = x; this.sy = y; this.vx = 0; this.vy = 0; this.seen = true; }
      const px = this.sx, py = this.sy;
      this.sx += (x - this.sx) * POS_SMOOTH;
      this.sy += (y - this.sy) * POS_SMOOTH;
      this.vx += ((this.sx - px) / dt - this.vx) * VEL_SMOOTH;
      this.vy += ((this.sy - py) / dt - this.vy) * VEL_SMOOTH;
    },
    drop() { this.seen = false; },
  };
}

let tracking = false;
document.getElementById("start").onclick = async (e) => {
  if (tracking) return;
  tracking = true;
  e.target.textContent = "starting camera…";
  try {
    await run();
    e.target.style.display = "none";
  } catch (err) {
    tracking = false;
    e.target.textContent = "camera unavailable — retry";
  }
};

async function run() {
  const vision = await FilesetResolver.forVisionTasks(WASM_URL);
  const landmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
    runningMode: "VIDEO",
    numHands: 2,
  });
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 360, facingMode: "user" },
  });
  video.srcObject = stream;
  await video.play();

  let lastVideoTime = -1;
  let lastT = performance.now();
  const breakHand = makeTrack(); // shatters/heals tiles
  const expoHand = makeTrack();  // dodge & burn
  let spread = 0;
  let navAt = 0;

  const loop = () => {
    requestAnimationFrame(loop);
    if (video.currentTime === lastVideoTime) return;
    lastVideoTime = video.currentTime;
    const now = performance.now();
    const dt = Math.min(0.1, Math.max(1 / 120, (now - lastT) / 1000));
    lastT = now;

    const res = landmarker.detectForVideo(video, now);
    const hands = res.landmarks || [];
    const labels = (res.handedness || res.handednesses || [])
      .map(h => h?.[0]?.categoryName);

    // Assign roles: the EXPOSURE_HAND label exposes, everything else breaks.
    // With one hand visible it falls through to breaking unless it's the
    // exposure hand.
    let bi = -1, ei = -1;
    for (let i = 0; i < hands.length; i++) {
      if (labels[i] === EXPOSURE_HAND && ei < 0) ei = i;
      else if (bi < 0) bi = i;
      else if (ei < 0) ei = i;
    }

    ctx.save();
    ctx.scale(-1, 1); // mirror the preview so hand-right = screen-right
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();

    const parts = [linked ? "linked to td" : "waiting for td"];

    // --- break hand -------------------------------------------------------
    let breakMsg = { present: false, x: breakHand.sx, y: breakHand.sy,
                     vx: 0, vy: 0, speed: 0, spread: 0, tips: [] };
    if (bi >= 0) {
      const lm = hands[bi];
      breakHand.update(lm, dt);
      const speed = Math.hypot(breakHand.vx, breakHand.vy);

      const tips = TIP_IDS.map(i => [1 - lm[i].x, 1 - lm[i].y]);
      const palmLen = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y);
      let gaps = 0;
      for (let i = 1; i < 4; i++) {
        gaps += Math.hypot(tips[i][0] - tips[i + 1][0], tips[i][1] - tips[i + 1][1]);
      }
      const raw = gaps / 3 / Math.max(palmLen, 1e-4);
      const target = Math.min(1, Math.max(0, (raw - SPREAD_MIN) / (SPREAD_MAX - SPREAD_MIN)));
      spread += (target - spread) * 0.3;

      breakMsg = { present: true, x: breakHand.sx, y: breakHand.sy,
                   vx: breakHand.vx, vy: breakHand.vy, speed, spread, tips };

      // preview: filled palm dot + velocity streak + fingertip dots
      const cx = breakHand.sx * canvas.width, cy = (1 - breakHand.sy) * canvas.height;
      ctx.strokeStyle = ctx.fillStyle = "#d8d4c8";
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + breakHand.vx * 40, cy - breakHand.vy * 40);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 4, 0, Math.PI * 2);
      ctx.fill();
      for (const [tx, ty] of tips) {
        ctx.beginPath();
        ctx.arc(tx * canvas.width, (1 - ty) * canvas.height, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      const deg = Math.round(Math.atan2(breakMsg.vy, breakMsg.vx) * 180 / Math.PI);
      parts.push(`break ${speed.toFixed(2)} @ ${deg}° · spread ${Math.round(spread * 100)}%`);
    } else {
      breakHand.drop();
      spread = 0;
    }

    // --- exposure hand ------------------------------------------------------
    let hand2 = { present: false, x: 0.5, y: 0.5, vy: 0 };
    if (ei >= 0) {
      expoHand.update(hands[ei], dt);
      hand2 = { present: true, x: expoHand.sx, y: expoHand.sy, vy: expoHand.vy };

      // preview: hollow circle + vertical intent line
      const cx = expoHand.sx * canvas.width, cy = (1 - expoHand.sy) * canvas.height;
      ctx.strokeStyle = "#d8d4c8";
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx, cy - expoHand.vy * 40);
      ctx.stroke();

      const dir = expoHand.vy > 0.15 ? "+" : expoHand.vy < -0.15 ? "−" : "·";
      parts.push(`expose ${dir}`);
    } else {
      expoHand.drop();
    }

    // --- gallery nav: one hand only, fast horizontal rip -------------------
    if (hands.length === 1 && now > navAt) {
      const t = bi >= 0 ? breakHand : expoHand;
      if (t.seen && Math.abs(t.vx) > NAV_V) {
        navAt = now + NAV_COOLDOWN;
        send({ type: "nav", dir: t.vx < 0 ? 1 : -1 });
        parts.push(t.vx < 0 ? "next image" : "previous image");
      }
    }

    if (bi < 0 && ei < 0) parts.push("no hands");
    send({ type: "hand", ...breakMsg, hand2 });
    statusEl.innerHTML = `<b>kiriko</b> — ` + parts.join(" · ");
  };
  loop();
}
</script>
</body>
</html>
